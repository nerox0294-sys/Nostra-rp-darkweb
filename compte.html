<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon compte - Nostra</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #210507 0%, #080808 45%);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #e50914;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(17, 17, 17, 0.96);
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .profile-top {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.3);
        }

        .profile-top h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            color: #35d06f;
            font-size: 13px;
            font-weight: bold;
        }

        .status::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #35d06f;
            border-radius: 50%;
            margin-right: 7px;
        }

        .info-box {
            background: #090909;
            border: 1px solid #242424;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .info {
            padding: 14px 0;
            border-bottom: 1px solid #222;
        }

        .info:first-child {
            padding-top: 0;
        }

        .info:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .label {
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 7px;
        }

        .value {
            font-size: 16px;
            font-weight: bold;
            word-break: break-word;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button,
        .home-button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }

        .logout {
            background: #e50914;
            border: 1px solid #e50914;
            color: white;
        }

        .logout:hover {
            background: #ff1a25;
            border-color: #ff1a25;
        }

        .home-button {
            background: transparent;
            border: 1px solid #333;
            color: white;
        }

        .home-button:hover {
            border-color: #e50914;
        }

        #message {
            text-align: center;
            color: #ff4d4d;
            font-size: 14px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px;
            }

            .logo {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            NOSTRA
        </div>

        <div class="card">

            <div class="profile-top">

                <div class="avatar" id="avatar">
                    ?
                </div>

                <h1 id="username">
                    Chargement...
                </h1>

                <div class="status">
                    Connecté
                </div>

            </div>


            <div id="message"></div>


            <div class="info-box">

                <div class="info">

                    <div class="label">
                        Pseudo
                    </div>

                    <div class="value" id="usernameInfo">
                        Chargement...
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Adresse e-mail
                    </div>

                    <div class="value" id="email">
                        Chargement...
                    </div>

                </div>

            </div>


            <div class="buttons">

                <button
                    class="logout"
                    id="logoutButton"
                >
                    SE DÉCONNECTER
                </button>

                <a
                    href="index.html"
                    class="home-button"
                >
                    ← RETOUR À L'ACCUEIL
                </a>

            </div>

        </div>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfEqB1n7jY6Go",

            authDomain: "nostra-9cb24.firebaseapp.com",

            projectId: "nostra-9cb24",

            storageBucket: "nostra-9cb24.firebasestorage.app",

            messagingSenderId: "681107105816",

            appId: "1:681107105816:web:b6a393594780d021e3bb6d",

            measurementId: "G-7ZPRB7P5PL"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const avatar =
            document.getElementById("avatar");

        const username =
            document.getElementById("username");

        const usernameInfo =
            document.getElementById("usernameInfo");

        const email =
            document.getElementById("email");

        const logoutButton =
            document.getElementById("logoutButton");

        const message =
            document.getElementById("message");


        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href =
                    "connexion.html";

                return;
            }


            const pseudo =
                user.displayName || "Joueur";


            username.textContent =
                pseudo;


            usernameInfo.textContent =
                pseudo;


            email.textContent =
                user.email || "Aucune adresse e-mail";


            // Première lettre du pseudo

            avatar.textContent =
                pseudo.charAt(0).toUpperCase();

        });


        logoutButton.addEventListener("click", async () => {

            logoutButton.disabled = true;

            logoutButton.textContent =
                "DÉCONNEXION...";


            try {

                await signOut(auth);

                window.location.href =
                    "index.html";

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Impossible de se déconnecter.";

                logoutButton.disabled = false;

                logoutButton.textContent =
                    "SE DÉCONNECTER";

            }

        });

    </script>

</body>
</html>
