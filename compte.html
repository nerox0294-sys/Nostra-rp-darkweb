<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon compte - Nostra</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 75px;
      background: #111;
      border-bottom: 1px solid #242424;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 50px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      color: #ff1e1e;
      letter-spacing: 2px;
    }

    .back {
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .back:hover {
      color: white;
    }

    main {
      min-height: calc(100vh - 75px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .account-box {
      width: 100%;
      max-width: 520px;
      background: #111;
      border: 1px solid #242424;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ff1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 38px;
      font-weight: 900;
      color: white;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .email {
      color: #999;
      margin-bottom: 25px;
      word-break: break-word;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 120, 0.08);
      border: 1px solid rgba(0, 255, 120, 0.2);
      color: #35e875;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #35e875;
      border-radius: 50%;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 9px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
      display: block;
    }

    .btn-profile {
      background: #ff1e1e;
      color: white;
    }

    .btn-profile:hover {
      background: #e51515;
    }

    .btn-logout {
      background: #1b1b1b;
      color: #ff5555;
      border: 1px solid #303030;
    }

    .btn-logout:hover {
      background: #242424;
    }

    .home {
      margin-top: 25px;
      display: inline-block;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    .home:hover {
      color: white;
    }

    #loading {
      color: #aaa;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NOSTRA</div>
    <a href="index.html" class="back">← Accueil</a>
  </header>

  <main>

    <div id="loading">
      Chargement du compte...
    </div>

    <div class="account-box" id="accountBox" style="display: none;">

      <div class="avatar" id="avatar">N</div>

      <h1 id="username">Utilisateur</h1>

      <div class="email" id="email"></div>

      <div class="status">
        <span class="dot"></span>
        Connecté
      </div>

      <div class="buttons">

        <a href="#" class="btn btn-profile" id="profileLink">
          VOIR MON PROFIL PUBLIC
        </a>

        <button class="btn btn-logout" id="logoutBtn">
          SE DÉCONNECTER
        </button>

      </div>

      <a href="index.html" class="home">
        ← Retour à l'accueil
      </a>

    </div>

  </main>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfEqBn1n7jY6Go",
      authDomain: "nostra-9cb24.firebaseapp.com",
      projectId: "nostra-9cb24",
      storageBucket: "nostra-9cb24.firebasestorage.app",
      messagingSenderId: "681107105816",
      appId: "1:681107105816:web:b6a393594780d021e3bb6d",
      measurementId: "G-7ZPRB7P5PL"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const loading = document.getElementById("loading");
    const accountBox = document.getElementById("accountBox");
    const username = document.getElementById("username");
    const email = document.getElementById("email");
    const avatar = document.getElementById("avatar");
    const profileLink = document.getElementById("profileLink");
    const logoutBtn = document.getElementById("logoutBtn");


    onAuthStateChanged(auth, (user) => {

      if (!user) {
        window.location.href = "connexion.html";
        return;
      }


      const pseudo = user.displayName || "Utilisateur";


      username.textContent = pseudo;
      email.textContent = user.email || "";

      avatar.textContent = pseudo.charAt(0).toUpperCase();


      profileLink.href =
        `profil.html?uid=${encodeURIComponent(user.uid)}`;


      loading.style.display = "none";
      accountBox.style.display = "block";

    });


    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        console.error("Erreur de déconnexion :", error);

      }

    });

  </script>

</body>
</html>
