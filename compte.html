<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon compte — Nostra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ff2b2b;
      margin-bottom: 30px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #ff2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .email {
      color: #999;
      margin-bottom: 25px;
      word-break: break-word;
    }

    .status {
      display: inline-block;
      background: #12351d;
      color: #6cff8b;
      border: 1px solid #236b34;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button,
    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    .profile-button {
      background: #ff2b2b;
      color: white;
    }

    .profile-button:hover {
      background: #e52222;
    }

    .logout-button {
      background: #292929;
      color: white;
    }

    .logout-button:hover {
      background: #3a3a3a;
    }

    .home-button {
      background: transparent;
      color: #888;
      border: 1px solid #292929;
    }

    .home-button:hover {
      color: white;
      border-color: #444;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">NOSTRA</div>

    <div class="avatar" id="avatar">
      ?
    </div>

    <h1 id="username">
      Chargement...
    </h1>

    <div class="email" id="email">
      Chargement...
    </div>

    <div class="status">
      ● Connecté
    </div>

    <div class="buttons">

      <a
        id="profileLink"
        class="button profile-button"
        href="#"
      >
        VOIR MON PROFIL PUBLIC
      </a>

      <button
        id="logoutButton"
        class="logout-button"
      >
        SE DÉCONNECTER
      </button>

      <a
        href="index.html"
        class="button home-button"
      >
        ← RETOUR À L'ACCUEIL
      </a>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfEqBn1n7jY6Go",
      authDomain: "nostra-9cb24.firebaseapp.com",
      projectId: "nostra-9cb24",
      storageBucket: "nostra-9cb24.firebasestorage.app",
      messagingSenderId: "681107105816",
      appId: "1:681107105816:web:b6a393594780d021e3bb6d",
      measurementId: "G-7ZPRB7P5PL"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const avatar = document.getElementById("avatar");
    const username = document.getElementById("username");
    const email = document.getElementById("email");
    const profileLink = document.getElementById("profileLink");
    const logoutButton = document.getElementById("logoutButton");


    onAuthStateChanged(auth, (user) => {

      if (!user) {
        window.location.href = "connexion.html";
        return;
      }


      const pseudo = user.displayName || "Membre Nostra";

      username.textContent = pseudo;
      email.textContent = user.email || "";

      avatar.textContent =
        pseudo.charAt(0).toUpperCase();


      // Lien vers le profil public
      profileLink.href =
        `profil.html?uid=${encodeURIComponent(user.uid)}`;

    });


    logoutButton.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        console.error(error);

        alert("Impossible de se déconnecter. Réessaie.");

      }

    });

  </script>

</body>
</html>
