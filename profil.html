<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profil — Nostra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #251010 0%, #0b0b0b 45%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: rgba(21, 21, 21, 0.96);
      border: 1px solid #2d2d2d;
      border-radius: 18px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .logo {
      color: #ff2b2b;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 35px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2b2b, #9e1111);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(255, 43, 43, 0.25);
    }

    .username {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .member {
      color: #ff4b4b;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .info {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      margin-bottom: 25px;
    }

    .info-title {
      color: #777;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .info-value {
      color: #ddd;
      font-size: 15px;
      word-break: break-all;
    }

    .back {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #292929;
      color: #aaa;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .back:hover {
      color: white;
      border-color: #444;
      background: #1c1c1c;
    }

    .loading {
      color: #888;
      font-size: 15px;
    }

    .error {
      color: #ff6464;
      background: #321414;
      border: 1px solid #682222;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">NOSTRA</div>

    <div id="loading" class="loading">
      Chargement du profil...
    </div>

    <div id="profile" class="hidden">

      <div class="avatar" id="avatar">
        ?
      </div>

      <div class="username" id="username">
        —
      </div>

      <div class="member">
        ● MEMBRE NOSTRA
      </div>

      <div class="info">

        <div class="info-title">
          Identifiant public
        </div>

        <div class="info-value" id="userId">
          —
        </div>

      </div>

      <a href="index.html" class="back">
        ← Retour à l'accueil
      </a>

    </div>

    <div id="error" class="hidden">

      <div class="error" id="errorMessage">
        Profil introuvable.
      </div>

      <a href="index.html" class="back">
        ← Retour à l'accueil
      </a>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfEqBn1n7jY6Go",
      authDomain: "nostra-9cb24.firebaseapp.com",
      projectId: "nostra-9cb24",
      storageBucket: "nostra-9cb24.firebasestorage.app",
      messagingSenderId: "681107105816",
      appId: "1:681107105816:web:b6a393594780d021e3bb6d",
      measurementId: "G-7ZPRB7P5PL"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    const loading = document.getElementById("loading");
    const profile = document.getElementById("profile");
    const error = document.getElementById("error");

    const avatar = document.getElementById("avatar");
    const username = document.getElementById("username");
    const userId = document.getElementById("userId");
    const errorMessage = document.getElementById("errorMessage");


    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    async function loadProfile() {

      const params = new URLSearchParams(
        window.location.search
      );

      const uid = params.get("uid");


      if (!uid) {

        loading.classList.add("hidden");
        error.classList.remove("hidden");

        errorMessage.textContent =
          "Aucun profil n'a été indiqué.";

        return;
      }


      try {

        const profileRef = doc(
          db,
          "profiles",
          uid
        );

        const profileSnapshot =
          await getDoc(profileRef);


        if (!profileSnapshot.exists()) {

          loading.classList.add("hidden");
          error.classList.remove("hidden");

          errorMessage.textContent =
            "Ce profil n'existe pas.";

          return;
        }


        const data = profileSnapshot.data();

        const pseudo =
          data.pseudo || "Membre Nostra";


        username.textContent = pseudo;

        avatar.textContent =
          pseudo.charAt(0).toUpperCase();

        userId.textContent = uid;


        loading.classList.add("hidden");
        profile.classList.remove("hidden");


      } catch (err) {

        console.error(err);

        loading.classList.add("hidden");
        error.classList.remove("hidden");

        errorMessage.textContent =
          "Impossible de charger ce profil.";

      }

    }


    loadProfile();

  </script>

</body>
</html>
