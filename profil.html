<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profil public - Nostra</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 75px;
      background: #111;
      border-bottom: 1px solid #242424;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 50px;
    }

    .logo {
      color: #ff1e1e;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .back {
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    main {
      min-height: calc(100vh - 75px);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 20px;
    }

    .profile-box {
      width: 100%;
      max-width: 500px;

      background: #111;
      border: 1px solid #242424;
      border-radius: 16px;

      padding: 40px;

      text-align: center;

      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .avatar {
      width: 100px;
      height: 100px;

      margin: 0 auto 20px;

      border-radius: 50%;

      background: #ff1e1e;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;
      font-weight: 900;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .member {
      color: #35e875;
      font-size: 13px;
      font-weight: 700;

      margin-bottom: 30px;
    }

    .info {
      background: #181818;
      border: 1px solid #292929;

      border-radius: 10px;

      padding: 18px;

      margin-bottom: 25px;

      text-align: left;
    }

    .label {
      color: #777;
      font-size: 12px;
      text-transform: uppercase;

      margin-bottom: 7px;
    }

    .value {
      color: #ddd;
      font-size: 14px;

      word-break: break-all;
    }

    .error {
      color: #ff5555;
      font-size: 15px;
      line-height: 1.5;
    }

    .loading {
      color: #aaa;
    }

    .home {
      display: inline-block;

      margin-top: 10px;

      color: #777;
      text-decoration: none;

      font-size: 13px;
    }

    .home:hover {
      color: white;
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      NOSTRA
    </div>

    <a href="index.html" class="back">
      ← Accueil
    </a>

  </header>


  <main>

    <div class="profile-box">

      <div id="loading" class="loading">
        Chargement du profil...
      </div>


      <div id="profileContent" style="display: none;">

        <div class="avatar" id="avatar">
          N
        </div>

        <h1 id="pseudo">
          Utilisateur
        </h1>

        <div class="member">
          ● MEMBRE NOSTRA
        </div>


        <div class="info">

          <div class="label">
            Identifiant public
          </div>

          <div class="value" id="uid">
          </div>

        </div>


        <a href="index.html" class="home">
          ← Retour à l'accueil
        </a>

      </div>


      <div id="error" class="error" style="display: none;">
        Impossible de charger ce profil.
      </div>

    </div>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfEqBn1n7jY6Go",

      authDomain: "nostra-9cb24.firebaseapp.com",

      projectId: "nostra-9cb24",

      storageBucket: "nostra-9cb24.firebasestorage.app",

      messagingSenderId: "681107105816",

      appId: "1:681107105816:web:b6a393594780d021e3bb6d",

      measurementId: "G-7ZPRB7P5PL"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    const loading =
      document.getElementById("loading");

    const profileContent =
      document.getElementById("profileContent");

    const error =
      document.getElementById("error");

    const pseudo =
      document.getElementById("pseudo");

    const avatar =
      document.getElementById("avatar");

    const uidElement =
      document.getElementById("uid");


    const params =
      new URLSearchParams(window.location.search);

    const uid =
      params.get("uid");


    async function loadProfile() {

      if (!uid) {

        loading.style.display = "none";

        error.textContent =
          "Aucun profil n'a été sélectionné.";

        error.style.display = "block";

        return;
      }


      try {

        const profileRef =
          doc(db, "profiles", uid);

        const profileSnap =
          await getDoc(profileRef);


        if (!profileSnap.exists()) {

          loading.style.display = "none";

          error.textContent =
            "Ce profil n'existe pas encore.";

          error.style.display = "block";

          return;
        }


        const data =
          profileSnap.data();


        const username =
          data.pseudo || "Utilisateur";


        pseudo.textContent =
          username;

        avatar.textContent =
          username.charAt(0).toUpperCase();

        uidElement.textContent =
          uid;


        loading.style.display =
          "none";

        profileContent.style.display =
          "block";


      } catch (err) {

        console.error(err);

        loading.style.display =
          "none";

        error.textContent =
          "Une erreur est survenue lors du chargement du profil.";

        error.style.display =
          "block";

      }

    }


    loadProfile();

  </script>

</body>
</html>
