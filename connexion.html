<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Nostra</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 50% 20%, #350000, transparent 45%),
        #050505;
}

.login-box {
    width: min(420px, 90%);
    padding: 40px;

    background: rgba(15,15,15,.95);
    border: 1px solid #292929;
    border-radius: 10px;

    box-shadow: 0 20px 80px rgba(0,0,0,.6);
}

.logo {
    text-align: center;

    color: #e50914;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 7px;

    margin-bottom: 35px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

label {
    display: block;
    color: #aaa;
    font-size: 14px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;

    margin-bottom: 20px;

    background: #090909;
    border: 1px solid #333;
    border-radius: 5px;

    color: white;
}

button {
    width: 100%;
    padding: 14px;

    background: #d90416;
    border: none;
    border-radius: 5px;

    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff1025;
}

.back {
    display: block;
    text-align: center;

    margin-top: 20px;

    color: #888;
    text-decoration: none;
}

.back:hover {
    color: white;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        NOSTRA
    </div>

    <h1>Connexion</h1>

    <form>

        <label>Email</label>
        <input type="email" placeholder="Ton adresse email">

        <label>Mot de passe</label>
        <input type="password" placeholder="Ton mot de passe">

        <button type="submit">
            SE CONNECTER
        </button>

    </form>

    <a class="back" href="index.html">
        ← Retour à l'accueil
    </a>

</div>

</body>
</html>
