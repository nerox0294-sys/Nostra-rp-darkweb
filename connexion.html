<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion - Nostra</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;

      background: #111;
      border: 1px solid #242424;
      border-radius: 16px;

      padding: 40px;
    }

    .logo {
      text-align: center;

      color: #ff1e1e;

      font-size: 30px;
      font-weight: 900;

      letter-spacing: 2px;

      margin-bottom: 30px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 30px;
    }

    label {
      display: block;

      color: #aaa;

      font-size: 13px;

      margin-bottom: 8px;
    }

    input {
      width: 100%;

      padding: 14px;

      background: #181818;

      border: 1px solid #303030;
      border-radius: 8px;

      color: white;

      outline: none;

      margin-bottom: 18px;

      font-size: 14px;
    }

    input:focus {
      border-color: #ff1e1e;
    }

    button {
      width: 100%;

      padding: 14px;

      background: #ff1e1e;

      color: white;

      border: none;
      border-radius: 8px;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #e51515;
    }

    .error {
      margin-top: 15px;

      color: #ff5555;

      font-size: 13px;

      text-align: center;

      line-height: 1.5;
    }

    .bottom {
      margin-top: 25px;

      text-align: center;

      color: #777;

      font-size: 13px;
    }

    .bottom a {
      color: #ff1e1e;

      text-decoration: none;
    }

    .home {
      display: block;

      margin-top: 20px;

      text-align: center;

      color: #777;

      text-decoration: none;

      font-size: 13px;
    }

    .home:hover {
      color: white;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      NOSTRA
    </div>

    <h1>
      Se connecter à son compte
    </h1>


    <form id="loginForm">

      <label for="email">
        Adresse e-mail
      </label>

      <input
        type="email"
        id="email"
        placeholder="ton@email.com"
        required
      >


      <label for="password">
        Mot de passe
      </label>

      <input
        type="password"
        id="password"
        placeholder="Ton mot de passe"
        required
      >


      <button type="submit">
        SE CONNECTER
      </button>

    </form>


    <div
      id="error"
      class="error"
    ></div>


    <div class="bottom">

      Pas encore de compte ?

      <a href="inscription.html">
        Créer un compte
      </a>

    </div>


    <a
      href="index.html"
      class="home"
    >
      ← Retour à l'accueil
    </a>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfBn1n7jY6Go",

      authDomain:
        "nostra-9cb24.firebaseapp.com",

      projectId:
        "nostra-9cb24",

      storageBucket:
        "nostra-9cb24.firebasestorage.app",

      messagingSenderId:
        "681107105816",

      appId:
        "1:681107105816:web:b6a393594780d021e3bb6d",

      measurementId:
        "G-7ZPRB7P5PL"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const form =
      document.getElementById("loginForm");


    const error =
      document.getElementById("error");


    /*
      On demande à Firebase de conserver
      la connexion dans le navigateur.
    */

    await setPersistence(
      auth,
      browserLocalPersistence
    );


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        error.textContent = "";


        const email =
          document.getElementById("email")
          .value
          .trim();


        const password =
          document.getElementById("password")
          .value;


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          window.location.href =
            "index.html";


        } catch (err) {

          console.error(err);


          if (
            err.code ===
            "auth/invalid-email"
          ) {

            error.textContent =
              "Adresse e-mail invalide.";

          }

          else if (
            err.code ===
            "auth/invalid-credential"
          ) {

            error.textContent =
              "E-mail ou mot de passe incorrect.";

          }

          else if (
            err.code ===
            "auth/user-disabled"
          ) {

            error.textContent =
              "Ce compte a été désactivé.";

          }

          else {

            error.textContent =
              "Une erreur est survenue. Réessaie.";

          }

        }

      }
    );

  </script>

</body>
</html>
