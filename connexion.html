<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Nostra</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #e50914;
            margin-bottom: 35px;
        }

        .card {
            background: #111;
            border: 1px solid #242424;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #080808;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e50914;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #e50914;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ff1a25;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .links {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 14px;
        }

        .links a {
            color: #e50914;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px;
            }

            .logo {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            NOSTRA
        </div>

        <div class="card">

            <h1>Connexion</h1>

            <p class="subtitle">
                Connecte-toi à ton compte Nostra
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="ton@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ton mot de passe"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    SE CONNECTER
                </button>

            </form>

            <div id="message"></div>

            <div class="links">
                Pas encore de compte ?
                <a href="inscription.html">Créer un compte</a>
            </div>

            <a href="index.html" class="back">
                ← Retour à Nostra
            </a>

        </div>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfEqB1n7jY6Go",
            authDomain: "nostra-9cb24.firebaseapp.com",
            projectId: "nostra-9cb24",
            storageBucket: "nostra-9cb24.firebasestorage.app",
            messagingSenderId: "681107105816",
            appId: "1:681107105816:web:b6a393594780d021e3bb6d",
            measurementId: "G-7ZPRB7P5PL"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            message.textContent = "";
            button.disabled = true;
            button.textContent = "CONNEXION...";


            try {

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                const user = userCredential.user;

                console.log("Utilisateur connecté :", user);

                message.textContent = "Connexion réussie !";
                message.style.color = "#35d06f";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);


            } catch (error) {

                console.error(error);

                message.style.color = "#ff4d4d";

                if (error.code === "auth/invalid-email") {

                    message.textContent =
                        "L'adresse e-mail n'est pas valide.";

                } else if (error.code === "auth/invalid-credential") {

                    message.textContent =
                        "E-mail ou mot de passe incorrect.";

                } else if (error.code === "auth/user-disabled") {

                    message.textContent =
                        "Ce compte a été désactivé.";

                } else {

                    message.textContent =
                        "Impossible de se connecter. Réessaie.";
                }

                button.disabled = false;
                button.textContent = "SE CONNECTER";
            }

        });

    </script>

</body>
</html>
