<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un compte — Nostra</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;

    background: #050505;

    color: white;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px;
}


/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;

    max-width: 480px;

    background: #0d0d0d;

    border: 1px solid #242424;

    border-radius: 10px;

    padding: 45px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5);
}


/* =========================
   LOGO
========================= */

.logo {
    text-align: center;

    color: #e50914;

    font-size: 32px;

    font-weight: 900;

    letter-spacing: 7px;

    margin-bottom: 10px;
}

.subtitle {
    text-align: center;

    color: #777;

    font-size: 14px;

    margin-bottom: 35px;
}


/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;

    color: #ccc;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 8px;
}

input {
    width: 100%;

    padding: 14px 15px;

    background: #151515;

    border: 1px solid #303030;

    border-radius: 5px;

    color: white;

    font-size: 14px;

    outline: none;

    transition: 0.3s;
}

input:focus {
    border-color: #d90416;

    box-shadow:
        0 0 0 2px rgba(217, 4, 22, 0.12);
}

input::placeholder {
    color: #555;
}


/* =========================
   BUTTON
========================= */

button {
    width: 100%;

    padding: 15px;

    margin-top: 10px;

    background: #d90416;

    color: white;

    border: none;

    border-radius: 5px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

button:hover {
    background: #ff1025;

    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.6;

    cursor: not-allowed;

    transform: none;
}


/* =========================
   MESSAGE
========================= */

.message {
    display: none;

    margin-top: 18px;

    padding: 12px;

    border-radius: 5px;

    font-size: 13px;

    text-align: center;

    line-height: 1.5;
}

.message.success {
    display: block;

    background: rgba(0, 150, 70, 0.12);

    border: 1px solid #087f3d;

    color: #54d98c;
}

.message.error {
    display: block;

    background: rgba(217, 4, 22, 0.12);

    border: 1px solid #8b0000;

    color: #ff6b75;
}


/* =========================
   LINKS
========================= */

.bottom {
    text-align: center;

    margin-top: 25px;

    color: #777;

    font-size: 13px;

    line-height: 2;
}

.bottom a {
    color: #e50914;

    text-decoration: none;
}

.bottom a:hover {
    text-decoration: underline;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .container {
        padding: 30px 22px;
    }

    .logo {
        font-size: 27px;
    }

}

</style>

</head>

<body>


<div class="container">

    <div class="logo">
        NOSTRA
    </div>

    <div class="subtitle">
        Crée ton compte et rejoins l'aventure.
    </div>


    <form id="signupForm">


        <!-- PSEUDO -->

        <div class="form-group">

            <label for="username">
                Pseudo
            </label>

            <input
                type="text"
                id="username"
                placeholder="Ton pseudo Nostra"
                minlength="3"
                maxlength="20"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Adresse email
            </label>

            <input
                type="email"
                id="email"
                placeholder="exemple@email.com"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 caractères"
                minlength="6"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirmer le mot de passe
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirme ton mot de passe"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            id="signupButton"
        >
            CRÉER MON COMPTE
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="bottom">

        Déjà un compte ?

        <a href="connexion.html">
            Se connecter
        </a>

        <br>

        <a href="index.html">
            ← Retour à l'accueil
        </a>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfEqB1n7jY6Go",

    authDomain: "nostra-9cb24.firebaseapp.com",

    projectId: "nostra-9cb24",

    storageBucket: "nostra-9cb24.firebasestorage.app",

    messagingSenderId: "681107105816",

    appId: "1:681107105816:web:b6a393594780d021e3bb6d",

    measurementId: "G-7ZPRB7P5PL"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* =========================
   FORMULAIRE
========================= */

const form =
    document.getElementById("signupForm");

const button =
    document.getElementById("signupButton");

const message =
    document.getElementById("message");


form.addEventListener("submit", async (event) => {

    event.preventDefault();


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    /* =========================
       VALIDATIONS
    ========================= */

    if (username.length < 3) {

        showMessage(
            "Le pseudo doit contenir au moins 3 caractères.",
            "error"
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "Les deux mots de passe ne correspondent pas.",
            "error"
        );

        return;
    }


    if (password.length < 6) {

        showMessage(
            "Le mot de passe doit contenir au moins 6 caractères.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "CRÉATION DU COMPTE...";


    try {

        /* =========================
           CREATION FIREBASE
        ========================= */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        /* =========================
           PSEUDO DU COMPTE
        ========================= */

        await updateProfile(
            user,
            {
                displayName: username
            }
        );


        showMessage(
            "Compte créé avec succès ! Redirection...",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "connexion.html";

        }, 1500);


    } catch (error) {

        console.error(error);


        let errorMessage =
            "Une erreur est survenue.";


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            errorMessage =
                "Cette adresse email possède déjà un compte.";

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            errorMessage =
                "L'adresse email n'est pas valide.";

        }

        else if (
            error.code ===
            "auth/weak-password"
        ) {

            errorMessage =
                "Le mot de passe est trop faible.";

        }

        else if (
            error.code ===
            "auth/operation-not-allowed"
        ) {

            errorMessage =
                "La connexion par email/mot de passe n'est pas activée dans Firebase.";

        }


        showMessage(
            errorMessage,
            "error"
        );


        button.disabled = false;

        button.textContent =
            "CRÉER MON COMPTE";

    }

});


/* =========================
   MESSAGE
========================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}

</script>


</body>

</html>
