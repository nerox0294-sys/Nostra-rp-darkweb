<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Créer un compte — Nostra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ff2b2b;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #ff2b2b;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #ff2b2b;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #e52222;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #3a1111;
      color: #ff6b6b;
      border: 1px solid #702020;
    }

    .success {
      display: block;
      background: #12351d;
      color: #6cff8b;
      border: 1px solid #236b34;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #999;
      font-size: 14px;
    }

    .login a {
      color: #ff3b3b;
      text-decoration: none;
      font-weight: bold;
    }

    .login a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">NOSTRA</div>

    <div class="subtitle">
      Crée ton compte Nostra
    </div>

    <h1>Inscription</h1>

    <form id="registerForm">

      <div class="form-group">
        <label for="username">Pseudo</label>
        <input
          type="text"
          id="username"
          placeholder="Ton pseudo"
          minlength="3"
          maxlength="20"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          placeholder="ton@email.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          placeholder="Minimum 6 caractères"
          minlength="6"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Retape ton mot de passe"
          minlength="6"
          required
        >
      </div>

      <button type="submit" id="registerButton">
        CRÉER MON COMPTE
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login">
      Déjà un compte ?
      <a href="connexion.html">Se connecter</a>
    </div>

    <a href="index.html" class="back">
      ← Retour à l'accueil
    </a>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDhCfjm-w29Ie1LUxhsMqUfEqBn1n7jY6Go",
      authDomain: "nostra-9cb24.firebaseapp.com",
      projectId: "nostra-9cb24",
      storageBucket: "nostra-9cb24.firebasestorage.app",
      messagingSenderId: "681107105816",
      appId: "1:681107105816:web:b6a393594780d021e3bb6d",
      measurementId: "G-7ZPRB7P5PL"
    };


    // Initialisation Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");


    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const username = document
        .getElementById("username")
        .value
        .trim();

      const email = document
        .getElementById("email")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      const confirmPassword = document
        .getElementById("confirmPassword")
        .value;


      // Vérification du pseudo
      if (username.length < 3) {
        showMessage(
          "Le pseudo doit contenir au moins 3 caractères.",
          "error"
        );
        return;
      }


      // Vérification des mots de passe
      if (password !== confirmPassword) {
        showMessage(
          "Les mots de passe ne correspondent pas.",
          "error"
        );
        return;
      }


      button.disabled = true;
      button.textContent = "CRÉATION EN COURS...";


      try {

        // Création du compte Firebase
        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = userCredential.user;


        // Enregistrement du pseudo dans Firebase Authentication
        await updateProfile(user, {
          displayName: username
        });


        // Création du profil public dans Firestore
        await setDoc(
          doc(db, "profiles", user.uid),
          {
            pseudo: username,
            createdAt: serverTimestamp()
          }
        );


        showMessage(
          "Compte créé avec succès ! Redirection...",
          "success"
        );


        // Petite pause pour afficher le message
        setTimeout(() => {
          window.location.href = "connexion.html";
        }, 1200);


      } catch (error) {

        console.error(error);

        let errorMessage =
          "Une erreur est survenue. Réessaie.";


        if (error.code === "auth/email-already-in-use") {
          errorMessage =
            "Cette adresse e-mail est déjà utilisée.";
        }

        else if (error.code === "auth/invalid-email") {
          errorMessage =
            "L'adresse e-mail n'est pas valide.";
        }

        else if (error.code === "auth/weak-password") {
          errorMessage =
            "Le mot de passe est trop faible.";
        }

        else if (error.code === "auth/operation-not-allowed") {
          errorMessage =
            "L'inscription par e-mail n'est pas activée dans Firebase.";
        }

        else if (error.code === "auth/network-request-failed") {
          errorMessage =
            "Problème de connexion Internet.";
        }

        showMessage(errorMessage, "error");

        button.disabled = false;
        button.textContent = "CRÉER MON COMPTE";
      }

    });

  </script>

</body>
</html>
