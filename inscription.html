<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un compte — Nostra</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 20%,
            #350000,
            transparent 45%
        ),
        #050505;
}

.register-box {
    width: min(440px, 90%);

    padding: 40px;

    background: rgba(15, 15, 15, 0.96);

    border: 1px solid #292929;

    border-radius: 10px;

    box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.6);
}

.logo {
    text-align: center;

    color: #e50914;

    font-size: 30px;

    font-weight: 900;

    letter-spacing: 7px;

    margin-bottom: 30px;
}

h1 {
    text-align: center;

    margin-bottom: 30px;

    font-size: 26px;
}

label {
    display: block;

    color: #aaa;

    font-size: 14px;

    margin-bottom: 8px;
}

input {
    width: 100%;

    padding: 14px;

    margin-bottom: 20px;

    background: #090909;

    border: 1px solid #333;

    border-radius: 5px;

    color: white;

    outline: none;

    font-size: 14px;
}

input::placeholder {
    color: #666;
}

input:focus {
    border-color: #d90416;
}

button {
    width: 100%;

    padding: 14px;

    background: #d90416;

    border: none;

    border-radius: 5px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;

    font-size: 14px;
}

button:hover {
    background: #ff1025;

    transform: translateY(-1px);
}

.back {
    display: block;

    text-align: center;

    margin-top: 20px;

    color: #888;

    text-decoration: none;

    font-size: 14px;
}

.back:hover {
    color: white;
}

</style>

</head>

<body>

<div class="register-box">

    <div class="logo">
        NOSTRA
    </div>

    <h1>
        Créer un compte
    </h1>

    <form>

        <!-- Pseudo Roblox -->

        <label for="roblox">
            Pseudo Roblox
        </label>

        <input
            type="text"
            id="roblox"
            name="roblox"
            placeholder="Ton pseudo Roblox"
            required
        >

        <!-- Nom d'utilisateur Nostra -->

        <label for="username">
            Nom d'utilisateur Nostra
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Ton pseudo Nostra"
            required
        >

        <!-- Email -->

        <label for="email">
            Adresse email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Ton adresse email"
            required
        >

        <!-- Mot de passe -->

        <label for="password">
            Mot de passe
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Ton mot de passe"
            required
        >

        <!-- Confirmation -->

        <label for="confirm-password">
            Confirmer le mot de passe
        </label>

        <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirme ton mot de passe"
            required
        >

        <button type="submit">
            CRÉER MON COMPTE
        </button>

    </form>

    <a
        class="back"
        href="index.html"
    >
        ← Retour à l'accueil
    </a>

</div>

</body>

</html>
